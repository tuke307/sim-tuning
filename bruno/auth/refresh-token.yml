info:
  name: refresh-token
  type: http
  seq: 10

http:
  method: POST
  url: "{{API_URL}}:{{API_PORT}}/api/auth/refresh-token"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (bru.cookies.has('csrfToken')) {
          const csrfToken = bru.cookies.get('csrfToken');
          bru.setEnvVar('CSRF_TOKEN', csrfToken);
          console.log('CSRF Token updated:', csrfToken);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
