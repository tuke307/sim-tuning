name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn turbo run build --filter=!@sim-tuning/apple

      - name: Lint
        run: yarn turbo run lint --filter=!@sim-tuning/apple

      - name: Unit tests
        run: yarn turbo run test --filter=!@sim-tuning/apple

      - name: Format check
        run: yarn format:check

  apple:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - id: apple
        name: Detect apple workspace
        run: |
          if [ -f apps/apple/Packages/SimTuningKit/Package.swift ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: SimTuningKit tests
        if: steps.apple.outputs.present == 'true'
        run: swift test --package-path apps/apple/Packages/SimTuningKit
