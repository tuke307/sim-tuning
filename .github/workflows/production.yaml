name: Production

# v3 is still being rebuilt: production deploys are manual until the cutover phase, when the
# push trigger moves to the new default branch.
on:
  workflow_dispatch:

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.decide.outputs.api }}
      web: ${{ steps.decide.outputs.web }}
      email-worker: ${{ steps.decide.outputs['email-worker'] }}
      db-migrate: ${{ steps.decide.outputs['db-migrate'] }}
    steps:
      - uses: actions/checkout@v6

      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            api:
              - '*'
              - '.*'
              - 'apps/api/**'
              - 'packages/common/**'
              - 'packages/database/**'
              - 'packages/eslint-config/**'
              - 'packages/logger/**'
              - 'packages/typescript-config/**'
            web:
              - '*'
              - '.*'
              - 'apps/web/**'
              - 'packages/common/**'
              - 'packages/ui/**'
              - 'packages/eslint-config/**'
              - 'packages/logger/**'
              - 'packages/typescript-config/**'
            email-worker:
              - '*'
              - '.*'
              - 'apps/api/**'
              - 'apps/email-worker/**'
              - 'packages/common/**'
              - 'packages/database/**'
              - 'packages/eslint-config/**'
              - 'packages/logger/**'
              - 'packages/typescript-config/**'
            db-migrate:
              - '*'
              - '.*'
              - 'packages/database/**'

      - id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "email-worker=true" >> "$GITHUB_OUTPUT"
            echo "db-migrate=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=${{ steps.filter.outputs.api }}" >> "$GITHUB_OUTPUT"
            echo "web=${{ steps.filter.outputs.web }}" >> "$GITHUB_OUTPUT"
            echo "email-worker=${{ steps.filter.outputs['email-worker'] }}" >> "$GITHUB_OUTPUT"
            echo "db-migrate=${{ steps.filter.outputs['db-migrate'] }}" >> "$GITHUB_OUTPUT"
          fi

  build-api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_REGISTRY: ghcr.io
      IMAGE_NAME: tuke307/sim-tuning-api
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ${{ env.GITHUB_REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GITHUB_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=build-api
          cache-to: type=gha,mode=max,scope=build-api
          tags: |
            ${{ env.GITHUB_REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  build-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_REGISTRY: ghcr.io
      IMAGE_NAME: tuke307/sim-tuning-web
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ${{ env.GITHUB_REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GITHUB_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=build-web
          cache-to: type=gha,mode=max,scope=build-web
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
          tags: |
            ${{ env.GITHUB_REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  build-email-worker:
    needs: changes
    if: needs.changes.outputs['email-worker'] == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_REGISTRY: ghcr.io
      IMAGE_NAME: tuke307/sim-tuning-email-worker
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ${{ env.GITHUB_REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GITHUB_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/email-worker/Dockerfile
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=build-email-worker
          cache-to: type=gha,mode=max,scope=build-email-worker
          tags: |
            ${{ env.GITHUB_REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  build-db-migrate:
    needs: changes
    if: needs.changes.outputs['db-migrate'] == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_REGISTRY: ghcr.io
      IMAGE_NAME: tuke307/sim-tuning-db-migrate
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ${{ env.GITHUB_REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GITHUB_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/database/Dockerfile.migration
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=build-db-migrate
          cache-to: type=gha,mode=max,scope=build-db-migrate
          tags: |
            ${{ env.GITHUB_REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: [build-api, build-web, build-email-worker, build-db-migrate]
    if: >-
      always() && !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      contains(needs.*.result, 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Coolify
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "COOLIFY_WEBHOOK secret is not configured yet — skipping Coolify webhook trigger."
            exit 0
          fi
          curl --fail --request POST "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"
