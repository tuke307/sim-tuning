# Own compose project, database, user and volumes so local SimTuning data never mixes with
# other stacks (e.g. luki-fitti). Host ports use a dedicated block: 5450/6390/8090/3010/3011/1030/8030.
name: sim-tuning

services:
  db:
    image: postgres:latest
    restart: always
    ports:
      - 5450:5432
    env_file:
      - ./packages/database/.env.production.local
    environment:
      # Pin the Postgres session timezone to UTC so timestamp storage and
      # CURRENT_TIMESTAMP match the app's UTC convention.
      - TZ=UTC
      - PGTZ=UTC
    volumes:
      - simtuning_pgdata:/var/lib/postgresql
    networks:
      - sim_tuning_network
  db-migrate:
    build:
      context: .
      dockerfile: ./packages/database/Dockerfile.migration
    restart: 'no' # Run once and exit
    env_file:
      - ./packages/database/.env.production.local
    depends_on:
      - db
      - redis
    networks:
      - sim_tuning_network
  caddy:
    image: caddy:alpine
    restart: always
    ports:
      - 8090:80
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
      - api
    networks:
      - sim_tuning_network
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    restart: always
    env_file:
      - ./apps/web/.env.production.local
    ports:
      - 3010:3000
    networks:
      - sim_tuning_network
  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    restart: always
    env_file:
      - ./apps/api/.env.production.local
    ports:
      - 3011:3001
    depends_on:
      - db-migrate
      - redis
      - mailpit
    networks:
      - sim_tuning_network
  email-worker:
    build:
      context: .
      dockerfile: ./apps/email-worker/Dockerfile
    restart: always
    env_file:
      - ./apps/email-worker/.env.production.local
    depends_on:
      - db-migrate
      - redis
      - mailpit
    networks:
      - sim_tuning_network
  mailpit:
    image: axllent/mailpit:latest
    restart: always
    ports:
      - 1030:1025 # SMTP server
      - 8030:8025 # Web UI & HTTP API (http://localhost:8030)
    networks:
      - sim_tuning_network
  redis:
    image: redis:alpine
    restart: always
    ports:
      - 6390:6379
    command: redis-server --appendonly yes
    volumes:
      - simtuning_redis:/data
    networks:
      - sim_tuning_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  simtuning_pgdata:
  simtuning_redis:

networks:
  sim_tuning_network:
    driver: bridge
